spring.application.name=canditature
server.port=8085
# Exposer health, info et metrics (seul health l'est par défaut)
management.endpoints.web.exposure.include=health,info,metrics
# Afficher le détail des composants dans /health
management.endpoint.health.show-details=always
# Transmettre à Eureka le statut de /health
eureka.client.healthcheck.enabled=true
# Publier les propriétés info.* dans /actuator/info
management.info.env.enabled=true

info.app.name=canditature
info.app.version=1.0.0
info.app.description=Microservice de gestion des candidatures
info.app.team=smartcampus